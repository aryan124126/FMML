# Load with:  python -m hifuel import samples/sample_week.yaml --sample
# The last post is a deliberately bad draft, so you can see what the claims check blocks.

summary: >-
  Sample week. Pathvik focuses on placement-season doubts, Earth.OSAI and Hi Fuel Advisory on CSR
  evidence and credit terms, ICLC opens conversations with principals, Tranzent Foundation tells a
  Born Green story, and the founder and Aryan get one advocacy draft each.
questions_for_team:
  - Are Earth.OSAI's survival checks and verifier workflow live features we can describe?
  - Does every ICLC participant receive a certificate? The principals' post assumes not, so it doesn't say so.
  - What scientific source sits behind the 22 kg CO2 per tree per year figure? Reviewers will want it in the notes.

posts:
  - idea_id: career-choice-check
    account: pathvik
    platform: instagram
    date: "2026-10-27"
    theme: educational
    pillar: Career-clarity tips
    format: carousel
    hook: "Job offer, MBA prep, or a gap year? You don't have to guess."
    caption: |-
      If you're in final year, you probably aren't short of options. You're short of a way to compare them.

      Swipe for a 4-question check you can do this week:
      1. What did you enjoy doing, not just score well in?
      2. Which roles use that every day?
      3. What would you need to learn to get there?
      4. Who could you ask, this month, about what the job is really like?

      Write the answers down. Comparing them on paper beats going round in circles in your head.
    cta: Save this for the weekend and send it to a friend who's deciding too.
    hashtags: ["#Pathvik", "#ClarityBeforeCareer", "#CareerClarity", "#FinalYear"]
    alt_text: "Navy carousel cover with violet text: 'Job, MBA or gap year? A 4-question check.'"
    design_brief:
      format_notes: 6-slide carousel, 4:5. Cover plus one question per slide, closing slide with the save prompt.
      slides:
        - {number: 1, text: "Job, MBA or gap year? A 4-question check", visual: "Bold violet type on navy, small orange arrow bottom right"}
        - {number: 2, text: "1. What did you enjoy doing, not just score well in?", visual: "Question in large type, short helper line in orange"}
        - {number: 3, text: "2. Which roles use that every day?", visual: "Same layout"}
        - {number: 4, text: "3. What would you need to learn to get there?", visual: "Same layout"}
        - {number: 5, text: "4. Who could you ask this month?", visual: "Same layout"}
        - {number: 6, text: "Write it down. Compare on paper. Clarity before career.", visual: "Pathvik wordmark, save icon"}
      layout_notes: Generous margins, one idea per slide, no stock photos.
      colours: ["#140F2F", "#8B7BFF", "#FE6A3C"]
    internal_notes: No claims or numbers beyond the 4 questions.

