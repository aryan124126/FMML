  - idea_id: proof-in-a-year
    account: founder_ashish
    platform: linkedin
    date: "2026-10-28"
    theme: founder_team_voice
    pillar: Opinions on ESG/CSR and growth
    format: text
    hook: "The question I now ask before every CSR conversation: what will we be able to prove in a year?"
    caption: |-
      In our work with companies and NGOs, the hardest part is rarely the budget or the intent. It's the evidence. A year on, can anyone show what changed, where, and for whom?

      So we're building our programmes around proof from day one: geo-tagged trees, checks on whether they survived, and records a CSR committee can actually audit.

      I'd rather report a smaller number we can stand behind than a big one we can't.
    cta: "CSR and ESG leaders: what evidence do you ask for today?"
    hashtags: ["#CSR", "#ESG", "#Impact"]
    personalise_prompt: >-
      Open with a real moment when a project looked good on paper but couldn't show results a year later.
      Add one detail only you would know: a place, a conversation, a number you can source.
    internal_notes: Draft for Ashish to rewrite in his own words and post himself.

