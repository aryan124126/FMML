  - idea_id: green-vs-carbon-credits
    account: hifuel_advisory
    platform: linkedin
    date: "2026-10-28"
    theme: educational
    pillar: Green credits vs carbon credits, India's carbon market (carefully sourced explainers)
    format: text
    hook: "Green credits and carbon credits are not the same thing. Mixing them up is an easy way to lose a CSR committee's trust."
    caption: |-
      Carbon credits represent verified emission reductions or removals, issued by a registry such as Verra or Gold Standard.

      India's Green Credit Programme, under rules notified by the central government in 2023, rewards specific environmental actions, such as plantation on degraded land.

      The practical test for a CSR or ESG head: before a project goes into a report, check which of these, if either, has actually been issued for it.

      If nothing has been issued, describe what you can show: plantation impact, survival records, estimated sequestration.
    cta: "Founders and CSR heads: which one comes up more in your board conversations?"
    hashtags: ["#ESG", "#CSR", "#CarbonMarkets", "#Sustainability"]
    claims_notes:
      - {claim: "Green Credit Programme rules notified by the central government in 2023", source: "Green Credit Rules, 2023 (Gazette of India notification, October 2023)", year: "2023"}
    internal_notes: Verify the notification date against the gazette before approving.

