  # ---------------- Earth.OSAI ----------------
  - idea_id: proof-not-photo-albums
    account: earth_osai
    platform: linkedin
    date: "2026-10-27"
    theme: educational
    pillar: Why CSR plantations need proof
    format: document
    hook: "A CSR plantation report full of photos tells you trees were planted. It doesn't tell you they're still alive."
    caption: |-
      Section 135 of the Companies Act asks qualifying companies to spend on CSR and report on it. Tree planting is a popular choice, and one of the hardest to verify a year later.

      What a useful plantation record shows:
      • Where each tree is, with a geo-tag
      • When it was planted, and which species
      • Whether it made it through the first monsoon and the first summer
      • Who checked, and how

      That's the difference between proof and a photo album. The document below walks through each step.
    cta: If you run CSR or ESG reporting, what do you ask your implementing partner for today?
    hashtags: ["#CSR", "#Reforestation", "#ESG", "#BRSR"]
    alt_text: "Document cover: a map with geo-tagged pins and the title 'Proof, not photo albums'."
    design_brief:
      format_notes: 5-page LinkedIn document (PDF carousel), 4:5.
      slides:
        - {number: 1, text: "Proof, not photo albums", visual: "Satellite-style map with tree pins"}
        - {number: 2, text: "Where: every tree geo-tagged", visual: "Zoomed map pin with coordinates"}
        - {number: 3, text: "What and when: species and planting date", visual: "Simple record card"}
        - {number: 4, text: "Still alive? Checks after the first monsoon and summer", visual: "Two-point timeline"}
        - {number: 5, text: "Who verified it, and how", visual: "Checklist with a verifier field"}
      layout_notes: Data-led, muted palette, maps over photos, no adjectives on slides.
    claims_notes:
      - {claim: "Section 135 asks qualifying companies to spend on CSR and report on it", source: "Companies Act, 2013, Section 135", year: "2013"}
    internal_notes: "[CONFIRM] Earth.OSAI brand colours, and that survival checks and the verifier field are live features."

