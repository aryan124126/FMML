  - idea_id: three-questions-for-partners
    account: earth_osai
    platform: linkedin
    date: "2026-10-29"
    theme: educational
    pillar: How verification works
    format: text
    hook: "Three questions to ask a CSR plantation partner before you sign."
    caption: |-
      1. How will we know where each tree is? Ask for geo-tagged locations, not district names.

      2. How and when will survival be checked? A planting-day photo can't answer this. Ask what is checked after the first monsoon and the first summer, and how.

      3. Who verifies, and can we see the underlying records? A summary slide is not evidence. Ask for the records behind it.

      If a partner can answer all three clearly, your CSR report will be much easier to defend.
    cta: Which of these do your partners find hardest to answer?
    hashtags: ["#CSR", "#ESG", "#Reforestation", "#ImpactMeasurement"]

  - idea_id: csr-impact-assessment
    account: earth_osai
    platform: linkedin
    date: "2026-10-30"
    theme: educational
    pillar: Regulation explainers (Section 135, CSR impact assessment, BRSR)
    format: text
    hook: "If your company's CSR obligation is ₹10 crore or more, some projects now need an independent impact assessment."
    caption: |-
      India's CSR rules were amended in 2021. Companies with an average CSR obligation of ₹10 crore or more in the three preceding financial years must have an impact assessment done, through an independent agency, for projects with outlays of ₹1 crore or more that were completed at least a year earlier.

      For plantation projects, that assessment is far easier when the evidence was collected from day one: where each tree is, which species, and whether it survived.

      Planning the evidence before planting costs less than reconstructing it a year later.
    cta: CSR heads, has an impact assessment changed how you plan projects?
    hashtags: ["#CSR", "#ImpactAssessment", "#ESG", "#Section135"]
    claims_notes:
      - {claim: "Impact assessment required for companies with average CSR obligation of ₹10 crore or more, for projects of ₹1 crore or more completed at least one year earlier, through an independent agency", source: "Companies (Corporate Social Responsibility Policy) Amendment Rules, 2021, Rule 8(3)", year: "2021"}
    internal_notes: Check the rule wording against the current MCA text before approving.

