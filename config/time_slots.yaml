# Best-time-to-post settings. All times are IST (Asia/Kolkata).
#
# Order of sources (the engine says which one it used):
#   1. own_audience   - when the account's followers are online (Instagram online_followers, last 30 days)
#   2. own_history    - the account's past posts: engagement per reach by weekday x hour
#   3. benchmark      - the starting hypotheses below, until we have 4-6 weeks of our own data
# Plus explore: ~20% of posts go to an untested hour inside the audience's active window.

timezone: Asia/Kolkata

spacing:
  max_posts_per_platform_per_day: 2     # per account, per platform (Stories count)
  min_gap_hours_same_platform: 3
  min_gap_minutes_same_account: 60     # between any two posts of one account, across platforms
  min_gap_hours_same_idea: 2      # repurposed versions of one idea across accounts
  explore_share: 0.2
  min_posts_per_slot_for_history: 3  # need this many past posts in a slot before trusting it

# Benchmarks are STARTING HYPOTHESES, not facts. Replace with real data after 4-6 weeks.
# weekdays: 0=Mon ... 6=Sun. slots: "HH:MM".
audiences:
  students:          # Pathvik: evenings and late nights
    active_hours: [12, 23]
    benchmark:
      - {weekdays: [0, 1, 2, 3, 4], slots: ["19:30", "21:30"]}
      - {weekdays: [5, 6], slots: ["12:00", "20:30"]}
  business:          # founders, CSR heads, principals: weekday business hours
    active_hours: [8, 19]
    benchmark:
      - {weekdays: [1, 2, 3], slots: ["09:30", "12:30"]}
      - {weekdays: [0, 4], slots: ["10:00", "13:00"]}
      - {weekdays: [5], slots: ["10:30"]}
  parents_community: # parents, RWAs: evenings and weekends
    active_hours: [7, 22]
    benchmark:
      - {weekdays: [0, 1, 2, 3, 4], slots: ["19:00", "20:30"]}
      - {weekdays: [5, 6], slots: ["10:00", "18:00"]}
