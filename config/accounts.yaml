# Accounts, initiatives and people the assistant plans for.
# Add a new initiative by copying a block. No code changes needed.
#
# Fields
#   type:        company | initiative | person
#   enabled:     include in plans by default
#   platforms:   platform -> posts per week  [CONFIRM volumes with Aryan]
#   audience:    platform -> audience clock (see time_slots.yaml)
#   facts:       confirmed facts the agent may state
#   do_not_state: things that are unconfirmed or not built yet (block if mentioned)
#   internal:    [INTERNAL] terms that must never appear in any public post
#   internal_in_own_posts: terms blocked only in this account's posts
#   allowed_prices: the only prices that may appear in posts (others are blocked)
#   confirmed_partners: partner/school/company names cleared for posts
#   approver:    who signs off posts for this account

accounts:
  hifuel_advisory:
    name: Hi Fuel Advisory
    type: company
    enabled: true
    priority: 1
    approver: manager
    website: hifueladvisory.lovable.app
    platforms: {linkedin: 3, instagram: 2, x: 3, facebook: 1}
    audience: {linkedin: business, instagram: business, x: business, facebook: business}
    colours: ["#064e3b"]
    voice: >-
      Confident, outcome-led, crisp business English for founders, CXOs, CSR and ESG heads.
      Specific, no fluff, no jargon stacking.
    pillars:
      - ESG and BRSR explainers
      - CSR law and practice (Section 135)
      - Green credits vs carbon credits, India's carbon market (carefully sourced explainers)
      - Founder point of view
      - Frameworks as carousels (HI-FUEL, O.L.I.V.E.R)
      - Insights launches (ESG Readiness Index, etc.)
      - Client stories (only with written consent)
      - Team and culture
    hashtags: ["#ESG", "#CSR", "#BRSR", "#Sustainability", "#MSME"]
    facts:
      - 'Tagline: "Fueling businesses. Powering growth. Building legacies."'
      - 'Positioning: "Not reports. Not decks. Outcomes."'
      - 10 practices, including Sustainability & ESG and CSR & Social Impact
      - Hi Fuel Growth Framework™ = Hear → Identify → Fuel → Upgrade → Expand → Lead
      - O.L.I.V.E.R Framework = Outcome Led Integrated Value & Execution Roadmap
      - 'Process: Discover → Diagnose → Design → Deliver → Drive Growth'
      - 'Upcoming insights: ESG Readiness Index, CSR & Social Impact Review, India Business Growth Outlook 2027'
      - Based in Noida (Logix Mall, Wave City Center, Sector 32), office in Okhla, New Delhi
    do_not_state:
      - The "80%" and "70%" figures on the website (unsourced)
    internal: []
    allowed_prices: []
    confirmed_partners: []

