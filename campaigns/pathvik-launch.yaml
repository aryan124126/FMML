      Three things that help more than another application:
      1. Name two or three roles you'd genuinely enjoy doing every day.
      2. Talk to one person in each of those roles this month.
      3. Write down what you'd need to learn to get there, and start on one thing this week.

      That's the kind of plan we build with people at Pathvik, live, with mentors.
    cta: Registrations are open; the link is in the first comment.
