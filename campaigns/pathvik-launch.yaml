# Pathvik launch campaign, 20 Oct - 1 Nov 2026. Drafted by Claude in chat.
# Load with:  python -m hifuel import campaigns/pathvik-launch.yaml
#
# Facts used (CLAUDE.md §2.2 + Aryan, 19 Oct 2026): the website is live and registrations are open;
# no prices; no cohort start date; no mentor names; no outcomes or testimonials (nothing has run yet).
# Calls to action: link in bio (Instagram), link in the first comment/reply (LinkedIn, X, Facebook), DMs.
#
# Strategy for reach:
#   - Instagram Reels built to be shared by DM (relatable, useful), carousels to be saved,
#     a Story every day (polls, Q&A, link sticker) to turn reach into registrations.
#   - X: one sharp line a day for students.  LinkedIn: graduates, placement cells and colleges.
#   - Facebook: parents, who often help decide.
#   - Founder and Aryan posts on LinkedIn (people reach far more than pages), flagged because
#     they disclose that Pathvik comes from the Hi Fuel group [CONFIRM affiliation disclosure].

campaign:
  id: pathvik-launch
  name: Pathvik launch
  account: pathvik
  start: "2026-10-20"
  end: "2026-11-01"
  goal: Get Pathvik in front of as many final-year students, recent graduates and parents as possible, and turn that reach into registrations.
  kpis: [Reach to non-followers, Shares per reach, Saves per reach, Profile visits and link clicks, Registrations and DMs]
  ctas: ["Link in bio (Instagram)", "Link in the first comment / reply (LinkedIn, X, Facebook)", "DM us"]

start: "2026-10-20"
end: "2026-11-01"
summary: >-
  Two-week launch push for Pathvik. Week 1 announces the launch and explains what Pathvik is (and isn't),
  with shareable Reels, save-worthy carousels and a Story every day. Week 2 keeps the reach going with
  career-clarity content for placement season, every post pointing to registrations. No prices, no dates,
  no promises: honesty is the hook.
questions_for_team:
  - What is Pathvik's website URL and Instagram handle? Posts say "link in bio" / "link in the first comment" until we have them.
  - Founder and team posts reveal that Pathvik comes from the Hi Fuel group. Is that OK to say publicly? If not, reject those three.
  - Who appears on camera in the Reels? It must be a real team member or mentor who has agreed.
  - Who is each programme for? The carousel on 21 Oct describes the two programmes from their names; please confirm the wording.
  - Is there a Pathvik WhatsApp Channel or Facebook Page? If not, skip the Facebook posts or post them from Tranzent/Hi Fuel.

