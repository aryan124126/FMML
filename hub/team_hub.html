<title>Hi Fuel Team Hub</title>

<style>
/* Hi Fuel Team Hub, v4. Layout: collapsible sidebar + telemetry header, bento overview, calendar
   (month / week timeline / kanban), split-screen review, analytics, ideas kanban. Deep emerald is the
   brand accent; semantic colours: success emerald, alert amber, error rose, info indigo (AA on their tints). */
:root {
  --bg: #f4f6f5; --surface: #ffffff; --surface-2: #eef2f0; --surface-3: #e3e9e6;
  --line: #dde4e0; --line-strong: #c3cec8;
  --fg: #101a15; --fg-2: #2e3c35; --muted: #55645b;
  --accent: #064e3b; --accent-hover: #0a6650; --accent-fg: #ffffff; --accent-soft: #dcefe6;
  --success: #047857; --success-soft: #d1fae5;
  --alert: #92400e; --alert-soft: #fef3c7;
  --error: #be123c; --error-soft: #ffe4e6;
  --info: #4338ca; --info-soft: #e0e7ff;
  --glass: rgb(255 255 255 / 0.74); --glass-line: rgb(255 255 255 / 0.6); --scrim: rgb(10 18 14 / 0.36);
  --shadow-1: 0 1px 2px rgb(16 26 21 / 0.05);
  --shadow-2: 0 1px 2px rgb(16 26 21 / 0.06), 0 4px 14px rgb(16 26 21 / 0.07);
  --shadow-3: 0 2px 6px rgb(16 26 21 / 0.08), 0 18px 48px rgb(16 26 21 / 0.18);
  --a-hifuel_advisory: #064e3b; --a-tranzent_foundation: #2f7d4f; --a-pathvik: #6d5ce8;
  --a-earth_osai: #1f6f8b; --a-iclc: #c2571a; --a-person: #7a6450; --a-other: #6f7f76;
  --p-instagram: #c72767; --p-linkedin: #0a66c2; --p-facebook: #1877f2; --p-x: #101a15; --p-whatsapp_channel: #178a46;
  --chart: #0b6b52; --chart-soft: rgb(11 107 82 / 0.12); --grid: #e4eae6;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px; --r-sm: 9px; --side: 240px; --side-mini: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b100e; --surface: #121a16; --surface-2: #18221d; --surface-3: #1f2b25; --line: #25322b; --line-strong: #344239;
    --fg: #e7eee9; --fg-2: #c4d1ca; --muted: #9aaba1; --accent: #5ad1a3; --accent-hover: #7ddcb7; --accent-fg: #04241a; --accent-soft: #163a2c;
    --success: #34d399; --success-soft: #0d2e22; --alert: #fbbf24; --alert-soft: #33270b; --error: #fb7185; --error-soft: #3a1219; --info: #a5b4fc; --info-soft: #1f1d4a;
    --glass: rgb(20 28 24 / 0.72); --glass-line: rgb(255 255 255 / 0.08); --scrim: rgb(0 0 0 / 0.55);
    --shadow-1: 0 1px 2px rgb(0 0 0 / 0.4); --shadow-2: 0 1px 2px rgb(0 0 0 / 0.35), 0 4px 14px rgb(0 0 0 / 0.3); --shadow-3: 0 2px 6px rgb(0 0 0 / 0.4), 0 18px 48px rgb(0 0 0 / 0.55);
    --a-hifuel_advisory: #5ad1a3; --a-tranzent_foundation: #7fcf94; --a-pathvik: #a99dff; --a-earth_osai: #6ec1dd; --a-iclc: #f29a5e; --a-person: #cdb69c; --a-other: #9aaba1;
    --p-instagram: #ff6ea4; --p-linkedin: #5aa7f0; --p-facebook: #6aa5ff; --p-x: #e7eee9; --p-whatsapp_channel: #42d98a;
    --chart: #5ad1a3; --chart-soft: rgb(90 209 163 / 0.14); --grid: #1f2b25;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b100e; --surface: #121a16; --surface-2: #18221d; --surface-3: #1f2b25; --line: #25322b; --line-strong: #344239;
  --fg: #e7eee9; --fg-2: #c4d1ca; --muted: #9aaba1; --accent: #5ad1a3; --accent-hover: #7ddcb7; --accent-fg: #04241a; --accent-soft: #163a2c;
  --success: #34d399; --success-soft: #0d2e22; --alert: #fbbf24; --alert-soft: #33270b; --error: #fb7185; --error-soft: #3a1219; --info: #a5b4fc; --info-soft: #1f1d4a;
  --glass: rgb(20 28 24 / 0.72); --glass-line: rgb(255 255 255 / 0.08); --scrim: rgb(0 0 0 / 0.55);
  --shadow-1: 0 1px 2px rgb(0 0 0 / 0.4); --shadow-2: 0 1px 2px rgb(0 0 0 / 0.35), 0 4px 14px rgb(0 0 0 / 0.3); --shadow-3: 0 2px 6px rgb(0 0 0 / 0.4), 0 18px 48px rgb(0 0 0 / 0.55);
  --a-hifuel_advisory: #5ad1a3; --a-tranzent_foundation: #7fcf94; --a-pathvik: #a99dff; --a-earth_osai: #6ec1dd; --a-iclc: #f29a5e; --a-person: #cdb69c; --a-other: #9aaba1;
  --p-instagram: #ff6ea4; --p-linkedin: #5aa7f0; --p-facebook: #6aa5ff; --p-x: #e7eee9; --p-whatsapp_channel: #42d98a;
  --chart: #5ad1a3; --chart-soft: rgb(90 209 163 / 0.14); --grid: #1f2b25;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--font-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3, p { margin: 0; }
h2 { font-family: var(--font-display); font-size: 1.08rem; letter-spacing: -0.01em; text-wrap: balance; }
h3 { font-size: 0.92rem; font-weight: 650; }
.muted { color: var(--muted); }
.small { font-size: 0.84rem; }
.xs { font-size: 0.76rem; }
.label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 650; }
.mono { font-family: var(--font-mono); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; min-width: 0; align-content: start; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; transition: grid-template-columns 0.2s ease; }
.app.mini { grid-template-columns: var(--side-mini) minmax(0, 1fr); }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden; background: var(--surface); border-right: 1px solid var(--line);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 12px 14px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; z-index: 7; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px; min-height: 40px; }
.mark { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.86rem; flex: none; }
.brand-text b { font-family: var(--font-display); font-size: 1.02rem; display: block; line-height: 1.15; white-space: nowrap; }
.brand-text span { color: var(--muted); font-size: 0.74rem; white-space: nowrap; }
.nav { display: grid; gap: 2px; }
.nav-label { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 650; padding: 10px 10px 4px; white-space: nowrap; }
.nav-item { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: var(--r-sm); color: var(--fg-2); font-weight: 520; text-align: left; white-space: nowrap; }
.nav-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-item:active { transform: scale(0.99); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.nav-item .count { margin-left: auto; font-size: 0.7rem; font-weight: 700; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--surface-3); text-align: center; font-variant-numeric: tabular-nums; }
.nav-item .count.hot { background: var(--accent); color: var(--accent-fg); }
.collapse { margin-top: auto; }
.me { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--r); background: var(--surface-2); font-size: 0.82rem; min-width: 0; }
.me small { display: block; color: var(--muted); font-size: 0.72rem; }
.app.mini .brand-text, .app.mini .nav-label, .app.mini .nav-item .txt, .app.mini .me > div { display: none; }
.app.mini .nav-item { justify-content: center; padding: 10px 0; }
.app.mini .nav-item .count { position: absolute; top: 2px; right: 4px; min-width: 16px; padding: 0 4px; font-size: 0.6rem; }
.app.mini .me { justify-content: center; background: none; }
/* tooltips on the collapsed rail and on icon-only buttons */
[data-tip] { position: relative; }
.app.mini .nav-item[data-tip]:hover::after, .app.mini .nav-item[data-tip]:focus-visible::after, .iconbtn[data-tip]:hover::after, .iconbtn[data-tip]:focus-visible::after {
  content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); background: var(--fg); color: var(--bg);
  padding: 5px 9px; border-radius: 7px; font-size: 0.76rem; font-weight: 600; white-space: nowrap; z-index: 40; pointer-events: none; box-shadow: var(--shadow-2); }
.iconbtn[data-tip]:hover::after, .iconbtn[data-tip]:focus-visible::after { left: 50%; top: calc(100% + 8px); transform: translateX(-50%); }

.shell { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.topbar-row { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; min-height: 40px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 0.86rem; color: var(--muted); min-width: 0; margin-right: auto; }
.crumbs button { border: 0; background: none; padding: 2px 4px; border-radius: 6px; color: var(--muted); }
.crumbs button:hover { color: var(--fg); background: var(--surface-2); }
.crumbs b { color: var(--fg); font-weight: 650; }
.crumbs .sep { opacity: 0.5; }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); position: relative; }
.sync.live i { background: var(--success); }
.sync.live i::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--success); opacity: 0; animation: ping 2.4s ease-out infinite; }
.sync.connecting i { background: var(--alert); }
.sync.offline i { background: var(--error); }
@keyframes ping { 0% { transform: scale(0.6); opacity: 0.7; } 100% { transform: scale(1.6); opacity: 0; } }
.page-head { padding: 18px max(22px, env(safe-area-inset-right, 0px)) 0 max(22px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
.page-head h1 { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: -0.02em; line-height: 1.15; }
.page-head p { color: var(--muted); font-size: 0.86rem; margin-top: 2px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toolbar .grow { flex: 1; }
main { padding: 16px max(22px, env(safe-area-inset-right, 0px)) 72px max(22px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; align-content: start; min-width: 0; }
.tabbar, .mobilebar { display: none; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 7px 13px; font-weight: 600; font-size: 0.84rem; color: var(--fg); line-height: 1.2; white-space: nowrap; transition: background 0.12s, border-color 0.12s, box-shadow 0.12s, transform 0.06s; }
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line-strong); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); box-shadow: var(--shadow-1); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--error); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.sm { padding: 5px 9px; font-size: 0.78rem; border-radius: 8px; }
.btn:disabled { opacity: 0.45; }
.btn .icon { width: 16px; height: 16px; }
.iconbtn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-sm); border: 1px solid transparent; background: none; color: var(--fg-2); }
.iconbtn:hover { background: var(--surface-2); color: var(--fg); }
.iconbtn:active { transform: translateY(1px); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; font-size: 0.82rem; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-1); }
.datenav { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.datenav button { border: 0; background: none; height: 28px; min-width: 28px; border-radius: 7px; padding: 0 8px; font-weight: 600; font-size: 0.82rem; color: var(--fg-2); }
.datenav button:hover { background: var(--surface-2); }
.datenav strong { min-width: 13ch; text-align: center; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
input[type="text"], input[type="search"], input[type="number"], input[type="date"], input[type="time"], input[type="url"], input[type="datetime-local"], textarea, select {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 8px 10px; font-size: 0.88rem; transition: border-color 0.12s, box-shadow 0.12s; }
input:hover, textarea:hover, select:hover { border-color: var(--line-strong); }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
textarea { resize: vertical; line-height: 1.45; }
.toolbar select, .toolbar input[type="search"] { width: auto; height: 34px; padding: 0 10px; font-size: 0.84rem; }
.toolbar input[type="search"] { width: 200px; }
.pchips { display: inline-flex; gap: 3px; }
.pchip { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); }
.pchip:hover { border-color: var(--line-strong); }
.pchip[aria-pressed="true"] { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 13%, var(--surface)); box-shadow: inset 0 0 0 1px var(--pc); }
label.field { display: grid; gap: 4px; font-size: 0.78rem; color: var(--muted); font-weight: 550; }
.check { display: flex; gap: 9px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); font-size: 0.86rem; cursor: pointer; }
.check:hover { border-color: var(--line-strong); }
.check input { margin-top: 3px; accent-color: var(--accent); }
.check.auto { background: var(--alert-soft); border-color: transparent; }

/* ---------- atoms ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-1); padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.card.raised { box-shadow: var(--shadow-2); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.7rem; font-weight: 650; padding: 2px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.5; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.shell { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); border: 0; }
.badge.shell::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.badge.draft { background: var(--surface-3); color: var(--fg-2); }
.badge.needs_changes { background: var(--alert-soft); color: var(--alert); }
.badge.approved { background: var(--success-soft); color: var(--success); }
.badge.scheduled { background: var(--info-soft); color: var(--info); }
.badge.posted { background: var(--success); color: var(--surface); }
.badge.posted::before { background: var(--surface); }
.badge.rejected { background: var(--surface-3); color: var(--muted); text-decoration: line-through; }
.badge.blocked, .badge.delayed { background: var(--error-soft); color: var(--error); }
.badge.campaign { background: var(--info-soft); color: var(--info); }
.badge.campaign::before { display: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.ava { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 0.64rem; font-weight: 700; color: #fff; background: var(--acct, var(--a-other)); flex: none; overflow: hidden; }
.ava img { width: 100%; height: 100%; object-fit: cover; }
.ava.sm { width: 20px; height: 20px; font-size: 0.56rem; }
.ava-stack { display: inline-flex; }
.ava-stack .ava { box-shadow: 0 0 0 2px var(--surface); }
.ava-stack .ava + .ava { margin-left: -6px; }
.pf { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; color: var(--pc); background: color-mix(in srgb, var(--pc) 13%, transparent); flex: none; }
.pf svg { width: 13px; height: 13px; }
.pf.lg { width: 28px; height: 28px; border-radius: 8px; }
.pf.lg svg { width: 17px; height: 17px; }
.bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-3); gap: 2px; }
.bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.76rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.empty { border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 28px 20px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; background: color-mix(in srgb, var(--surface) 50%, transparent); }
.empty .icon { width: 28px; height: 28px; color: var(--muted); }
.empty strong { color: var(--fg); font-size: 0.98rem; }
.empty ol { text-align: left; margin: 4px 0; padding-left: 1.2rem; display: grid; gap: 4px; max-width: 520px; }
.skel { background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; border-radius: 10px; animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 0% { background-position: 100% 0; opacity: 0.8; } 50% { opacity: 1; } 100% { background-position: -100% 0; opacity: 0.8; } }
.issues { display: grid; gap: 6px; list-style: none; margin: 0; padding: 0; }
.issue { font-size: 0.82rem; border-radius: var(--r-sm); padding: 8px 10px; display: grid; gap: 2px; }
.issue.block { background: var(--error-soft); color: var(--error); }
.issue.flag { background: var(--alert-soft); color: var(--alert); }
.issue q { color: var(--fg-2); font-size: 0.77rem; }
.okline { display: flex; gap: 8px; align-items: center; color: var(--success); font-size: 0.85rem; font-weight: 600; }
details.fold { border-top: 1px solid var(--line); padding-top: 10px; }
details.fold > summary { cursor: pointer; font-weight: 650; font-size: 0.86rem; list-style: none; display: flex; align-items: center; gap: 8px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "›"; font-size: 1.1rem; line-height: 1; color: var(--muted); width: 10px; transition: transform 0.15s; }
details.fold[open] > summary::before { transform: rotate(90deg); }
.brief { display: grid; gap: 9px; font-size: 0.84rem; margin-top: 9px; }
.brief ol, .brief ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 3px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.83rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }

th { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 650; background: var(--surface-2); position: sticky; top: 0; }
th button { border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; padding: 0; display: inline-flex; gap: 4px; align-items: center; }
th button:hover { color: var(--fg); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
th.n button { flex-direction: row-reverse; }

/* ---------- overview bento ---------- */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-1); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; text-align: left; }
button.tile { cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s, transform 0.06s; }
button.tile:hover { border-color: var(--line-strong); box-shadow: var(--shadow-2); }
button.tile:active { transform: translateY(1px); }
.kv { font-family: var(--font-display); font-size: 2rem; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kk { color: var(--muted); font-size: 0.8rem; font-weight: 600; }
.tile.hero { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tile.hero .kk, .tile.hero .muted { color: color-mix(in srgb, var(--accent-fg) 80%, transparent); }
.tile.alert .kv { color: var(--error); }
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 0.78rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--success); }
.delta.down { color: var(--error); }
.delta.flat { color: var(--muted); }
.spot { position: relative; overflow: hidden; }
.spot::after { content: ""; position: absolute; top: -70px; right: -70px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--a-pathvik) 22%, transparent), transparent 70%); pointer-events: none; }
.spot-badge { width: 42px; height: 42px; border-radius: 12px; background: var(--a-pathvik); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; flex: none; }
.progress { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--a-pathvik); }
.pcounts { display: flex; flex-wrap: wrap; gap: 6px; }
.pcount { display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px 4px 4px; border-radius: 9px; background: var(--surface-2); font-size: 0.8rem; }
.list-rows { display: grid; gap: 2px; }
.lrow { display: grid; grid-template-columns: 46px 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: var(--r-sm); border: 0; background: none; text-align: left; width: 100%; }
.lrow:hover { background: var(--surface-2); }
.lrow .t { font-size: 0.86rem; }
.lrow .s { font-size: 0.74rem; color: var(--muted); }
.grouphead { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 650; padding: 8px 8px 2px; }
.who { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.who:last-child { border-bottom: 0; }
.who .n { margin-left: auto; font-family: var(--font-display); font-size: 1.25rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.feed { display: grid; gap: 10px; }
.feed .ev { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; font-size: 0.84rem; align-items: start; }
.feed .ev p { overflow-wrap: anywhere; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; text-align: left; font-size: inherit; }
.linkbtn:hover { text-decoration: underline; }

/* ---------- post card (calendar) ---------- */
.pcard { position: relative; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 8px; display: grid; gap: 6px; box-shadow: var(--shadow-1); min-width: 0; cursor: pointer;
  transition: box-shadow 0.12s, border-color 0.12s, transform 0.08s; }
.pcard:hover { border-color: var(--line-strong); box-shadow: var(--shadow-2); }
.pcard:active { transform: scale(0.995); }
.pcard[draggable="true"] { cursor: grab; }
.pcard.dragging { opacity: 0.45; }
.pcard .thumb { height: 54px; border-radius: 8px; background: linear-gradient(140deg, var(--c1), var(--c2)); color: #fff; display: grid; place-items: center; padding: 6px 8px; font-size: 0.7rem; font-weight: 650; text-align: center; line-height: 1.2; overflow: hidden; position: relative; }
.pcard .thumb.text { background: var(--surface-2); color: var(--fg-2); font-weight: 500; place-items: start; text-align: left; font-size: 0.72rem; }
.pcard .thumb .fmt { position: absolute; top: 4px; right: 4px; background: rgb(0 0 0 / 0.42); color: #fff; font-size: 0.58rem; padding: 1px 6px; border-radius: 999px; font-weight: 700; letter-spacing: 0.03em; }
.pcard .top { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--muted); min-width: 0; }
.pcard .top .mono { color: var(--fg); font-size: 0.74rem; }
.pcard .copy { font-size: 0.8rem; line-height: 1.32; }
.pcard .foot { display: flex; align-items: center; gap: 6px; justify-content: space-between; min-width: 0; }
.pcard.compact { padding: 6px 7px; gap: 3px; border-radius: 9px; }
.pcard.compact .copy { font-size: 0.74rem; -webkit-line-clamp: 1; }
.pcard .menu-btn { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 6px; border: 0; background: var(--surface); color: var(--muted); display: none; place-items: center; box-shadow: var(--shadow-1); }
.pcard:hover .menu-btn, .pcard:focus-within .menu-btn { display: grid; }
.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; background: color-mix(in srgb, var(--accent) 8%, transparent) !important; }

/* month */
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--line); gap: 1px; }
.month .dow { background: var(--surface-2); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 650; padding: 7px 9px; }
.mcell { background: var(--surface); min-height: 128px; padding: 6px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.mcell.out { background: color-mix(in srgb, var(--surface-2) 60%, var(--surface)); }
.mcell.out .dnum { opacity: 0.5; }
.mcell.today { box-shadow: inset 0 0 0 2px var(--accent); }
.mcell .dhead { display: flex; justify-content: space-between; align-items: center; gap: 4px; min-width: 0; }
.dnum { font-family: var(--font-display); font-weight: 650; font-size: 0.92rem; }
.dtag { font-size: 0.6rem; font-weight: 650; color: var(--info); background: var(--info-soft); padding: 1px 5px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dtag.sensitive { color: var(--error); background: var(--error-soft); }
.more { border: 0; background: none; color: var(--accent); font-size: 0.72rem; font-weight: 650; text-align: left; padding: 2px; }

/* week timeline */
.timeline-wrap { position: relative; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: auto; max-height: calc(100vh - 230px); min-height: 420px; }
.timeline { display: grid; grid-template-columns: 54px repeat(7, minmax(140px, 1fr)); min-width: 1040px; }
.tl-head { position: sticky; top: 0; z-index: 2; background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 8px; font-size: 0.78rem; font-weight: 650; display: flex; align-items: baseline; gap: 6px; }
.tl-head.today { color: var(--accent); }
.tl-head .dnum { font-size: 1.05rem; }
.tl-corner { position: sticky; top: 0; left: 0; z-index: 3; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.tl-hour { position: sticky; left: 0; z-index: 1; background: var(--surface); font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); padding: 2px 6px; text-align: right; border-right: 1px solid var(--line); }
.tl-cell { border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); min-height: 30px; padding: 2px; display: grid; gap: 2px; align-content: start; }
.tl-cell.half { border-bottom-style: dashed; }
.tl-cell.now { box-shadow: inset 0 2px 0 var(--error); }

/* kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; align-items: start; }
.kcol { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: grid; gap: 8px; align-content: start; min-height: 220px; scroll-snap-align: start; }
.kcol-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 2px; }
.kcol-head h3 { display: flex; align-items: center; gap: 7px; font-size: 0.84rem; }
.kcol-head .n { font-size: 0.72rem; font-weight: 700; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 1px 8px; }
.kcol .hint { font-size: 0.72rem; color: var(--muted); padding: 0 4px; }

/* ---------- review split ---------- */
.review { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; align-items: start; }
.queue { position: sticky; top: 74px; max-height: calc(100vh - 92px); overflow-y: auto; display: grid; gap: 6px; align-content: start; padding: 2px; }
.qitem { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; transition: border-color 0.12s, box-shadow 0.12s; }
.qitem:hover { border-color: var(--line-strong); }
.qitem[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-2); }
.qitem .t { font-size: 0.84rem; font-weight: 550; }
.qitem .s { font-size: 0.74rem; color: var(--muted); }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.stage { background: radial-gradient(circle at 30% 0%, color-mix(in srgb, var(--accent) 8%, var(--surface-2)), var(--surface-2)); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; justify-items: center; gap: 10px; position: sticky; top: 74px; }
.stage .frame { width: 100%; max-width: 420px; }
.actionbar { position: sticky; bottom: 10px; z-index: 3; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px; border-radius: var(--r); background: var(--glass); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border: 1px solid var(--line); box-shadow: var(--shadow-3); }
.actionbar .grow { flex: 1; }
.kbd { font-family: var(--font-mono); font-size: 0.66rem; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); background: var(--surface); }
.thread { display: grid; gap: 12px; }
.msg { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; }
.msg .bubble { background: var(--surface-2); border-radius: 4px 12px 12px 12px; padding: 8px 11px; font-size: 0.85rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.sys .bubble { background: transparent; padding: 3px 0; color: var(--muted); font-size: 0.8rem; }
.msg.change .bubble { background: var(--alert-soft); }
.msg.change ul { margin: 4px 0 0; padding-left: 1.1rem; }
.msg .meta { font-size: 0.72rem; color: var(--muted); margin-bottom: 3px; }
.composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }

/* ---------- platform previews ---------- */
.pv { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; font-size: 0.86rem; box-shadow: var(--shadow-2); width: 100%; }
.pv-head { display: flex; align-items: center; gap: 9px; padding: 10px 12px; min-width: 0; }
.pv-head b { font-size: 0.84rem; display: block; line-height: 1.2; }
.pv-head small { color: var(--muted); font-size: 0.72rem; }
.pv-head .pf { margin-left: auto; }
.pv-media { aspect-ratio: 4 / 5; width: 100%; display: grid; place-items: center; padding: 22px; text-align: center; color: #fff; position: relative; background: linear-gradient(150deg, var(--c1), var(--c2)); }
.pv-media.reel { aspect-ratio: 9 / 14; }
.pv-media.doc { aspect-ratio: 4 / 3; }
.pv-media p { font-family: var(--font-display); font-weight: 650; font-size: 1.25rem; line-height: 1.2; text-wrap: balance; text-shadow: 0 1px 12px rgb(0 0 0 / 0.25); max-width: 92%; }
.pv-media .tag { position: absolute; top: 10px; right: 10px; font-size: 0.66rem; font-weight: 700; background: rgb(0 0 0 / 0.45); padding: 3px 8px; border-radius: 999px; }
.pv-media .dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; }
.pv-media .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgb(255 255 255 / 0.5); }
.pv-media .dots i:first-child { background: #fff; }
.pv-media .play { position: absolute; width: 42px; height: 42px; border-radius: 50%; background: rgb(0 0 0 / 0.35); display: grid; place-items: center; bottom: 14px; left: 14px; }
.pv-icons { display: flex; gap: 14px; padding: 10px 12px 2px; color: var(--fg-2); }
.pv-icons .icon { width: 21px; height: 21px; }
.pv-icons .spacer { margin-left: auto; }
.pv-text { padding: 8px 12px 12px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
.pv-text.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; padding-bottom: 0; margin-bottom: 4px; }
.pv-more { border: 0; background: none; color: var(--muted); font-size: 0.8rem; padding: 0 12px 10px; font-weight: 600; }
.pv-tags { color: var(--p-linkedin); }
.pv-actions { display: flex; justify-content: space-around; border-top: 1px solid var(--line); padding: 8px 6px; color: var(--muted); font-size: 0.78rem; font-weight: 600; }
.pv-actions span { display: inline-flex; align-items: center; gap: 5px; }
.pv-actions .icon { width: 16px; height: 16px; }
.pv-x { padding: 12px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
.pv-x + .pv-x { border-top: 1px solid var(--line); }
.pv-story { aspect-ratio: 9 / 16; margin: 0 auto; border-radius: 16px; overflow: hidden; position: relative; color: #fff; background: linear-gradient(170deg, var(--c1), var(--c2));
  display: grid; align-content: center; justify-items: center; gap: 14px; padding: 46px 18px 24px; text-align: center; width: 100%; max-width: 260px; box-shadow: var(--shadow-2); }
.pv-story .bars { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 3px; }
.pv-story .bars i { flex: 1; height: 3px; border-radius: 3px; background: rgb(255 255 255 / 0.4); }
.pv-story .bars i:first-child { background: #fff; }
.pv-story p { font-family: var(--font-display); font-weight: 650; font-size: 1.12rem; line-height: 1.25; text-wrap: balance; }
.pv-story .sticker { background: #fff; color: #101a15; border-radius: 10px; padding: 8px 12px; font-size: 0.76rem; font-weight: 650; }
.pv-story .whos { position: absolute; top: 20px; left: 12px; display: flex; gap: 6px; align-items: center; font-size: 0.72rem; font-weight: 650; }
.pv-wa { background: color-mix(in srgb, var(--p-whatsapp_channel) 10%, var(--surface-2)); padding: 16px; }
.pv-wa .bubble { background: var(--surface); border-radius: 4px 14px 14px 14px; padding: 10px 12px; box-shadow: var(--shadow-1); white-space: pre-wrap; overflow-wrap: anywhere; display: grid; gap: 6px; }
.chars { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.chars.over { color: var(--error); font-weight: 600; }

/* ---------- analytics ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.charts { display: grid; gap: 0; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .line { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--chart-soft); stroke: none; }
.chart .pt { fill: var(--chart); stroke: var(--surface); stroke-width: 2; }
.chart .xhair { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .hit { fill: transparent; }
.tooltip { position: absolute; pointer-events: none; z-index: 5; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-3);
  padding: 8px 10px; font-size: 0.78rem; min-width: 150px; transform: translate(-50%, -100%); white-space: nowrap; }
.tooltip b { font-variant-numeric: tabular-nums; }
.menu { position: absolute; z-index: 30; min-width: 220px; background: var(--glass); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-3); padding: 6px; display: grid; gap: 2px; }
.menu button { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 0.85rem; }
.menu button:hover, .menu button:focus-visible { background: var(--surface-2); }
.menu small { display: block; color: var(--muted); font-size: 0.74rem; }

/* ---------- ideas board ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; align-items: start; scroll-snap-type: x proximity; }
.lane { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: grid; gap: 8px; align-content: start; min-height: 260px; scroll-snap-align: start; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px; display: grid; gap: 8px; box-shadow: var(--shadow-1); transition: box-shadow 0.12s, border-color 0.12s; }
.idea:hover { border-color: var(--line-strong); box-shadow: var(--shadow-2); }
.idea[draggable="true"] { cursor: grab; }
.idea p { font-size: 0.86rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.vote { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 8px; font-size: 0.78rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.vote:hover { border-color: var(--line-strong); }
.vote[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: 4px; }
.links a { font-size: 0.74rem; color: var(--info); background: var(--info-soft); border-radius: 6px; padding: 1px 7px; text-decoration: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.shots img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.lane-add { border: 1.5px dashed var(--line-strong); background: none; border-radius: 10px; padding: 8px; color: var(--muted); font-weight: 600; font-size: 0.82rem; }
.lane-add:hover { color: var(--fg); border-color: var(--muted); }

/* ---------- overlays ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.modal { position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 24px)); max-height: calc(100vh - 40px); overflow-y: auto;
  background: var(--glass); backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5); border: 1px solid var(--glass-line); outline: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-3); padding: 20px; display: grid; gap: 14px; }
.modal.wide { width: min(1080px, calc(100% - 24px)); }
.modal h2 { font-size: 1.2rem; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.toastbox { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: grid; gap: 8px; justify-items: end; }
