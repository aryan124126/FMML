<title>Hi Fuel Team Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an operations console. Sidebar navigation on desktop, bottom tab bar on phones.
   Overview dashboard first; every post can be opened as a platform-styled preview.
   Deep emerald from Hi Fuel Advisory is the single accent; platform colours only mark platforms. */
:root {
  --bg: #f3f6f4;
  --surface: #ffffff;
  --surface-2: #edf2ef;
  --surface-3: #e3eae6;
  --line: #d7e0db;
  --line-strong: #bfccc5;
  --fg: #12201a;
  --fg-2: #33443b;
  --muted: #5d6e65;
  --accent: #064e3b;
  --accent-2: #0b6b52;
  --accent-fg: #ffffff;
  --accent-soft: #dceee6;
  --block: #b42318; --block-soft: #fde8e6;
  --flag: #8a5a00; --flag-soft: #fcf1d6;
  --ok: #157347; --ok-soft: #dcf2e6;
  --info: #2a4f8f; --info-soft: #e5ecf8;
  --shadow: 0 1px 2px rgb(18 32 26 / 0.05), 0 2px 8px rgb(18 32 26 / 0.05);
  --shadow-lg: 0 10px 40px rgb(18 32 26 / 0.18);
  --a-hifuel_advisory: #064e3b; --a-tranzent_foundation: #2f7d4f; --a-pathvik: #6d5ce8;
  --a-earth_osai: #1f6f8b; --a-iclc: #c2571a; --a-person: #7a6450; --a-other: #7a8a80;
  --p-instagram: #c72767; --p-linkedin: #0a66c2; --p-facebook: #1877f2; --p-x: #12201a; --p-whatsapp_channel: #178a46;
  --st-draft: #9aa9a1; --st-needs_changes: #d49a1c; --st-approved: #2f9e66; --st-scheduled: #2a6fdb; --st-posted: #064e3b; --st-rejected: #c8d1cc;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px; --radius-sm: 9px;
  --sidebar: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1310; --surface: #141c18; --surface-2: #1a241f; --surface-3: #22302a; --line: #26332d; --line-strong: #34453d;
    --fg: #e5ede8; --fg-2: #c3d0c9; --muted: #92a49a; --accent: #5cc79c; --accent-2: #7ad6b0; --accent-fg: #052119; --accent-soft: #183a2d;
    --block: #ff8f86; --block-soft: #3a1b19; --flag: #f1c661; --flag-soft: #382e15; --ok: #6fd6a0; --ok-soft: #163426; --info: #9dbaf0; --info-soft: #1b273f;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 2px 8px rgb(0 0 0 / 0.25); --shadow-lg: 0 10px 40px rgb(0 0 0 / 0.5);
    --a-hifuel_advisory: #5cc79c; --a-tranzent_foundation: #7fcf94; --a-pathvik: #a99dff; --a-earth_osai: #6ec1dd; --a-iclc: #f29a5e; --a-person: #cdb69c; --a-other: #92a49a;
    --p-instagram: #ff6ea4; --p-linkedin: #5aa7f0; --p-facebook: #6aa5ff; --p-x: #e5ede8; --p-whatsapp_channel: #42d98a;
    --st-draft: #6c7c73; --st-needs_changes: #e0ac35; --st-approved: #4cc287; --st-scheduled: #5d9bff; --st-posted: #5cc79c; --st-rejected: #34453d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1310; --surface: #141c18; --surface-2: #1a241f; --surface-3: #22302a; --line: #26332d; --line-strong: #34453d;
  --fg: #e5ede8; --fg-2: #c3d0c9; --muted: #92a49a; --accent: #5cc79c; --accent-2: #7ad6b0; --accent-fg: #052119; --accent-soft: #183a2d;
  --block: #ff8f86; --block-soft: #3a1b19; --flag: #f1c661; --flag-soft: #382e15; --ok: #6fd6a0; --ok-soft: #163426; --info: #9dbaf0; --info-soft: #1b273f;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 2px 8px rgb(0 0 0 / 0.25); --shadow-lg: 0 10px 40px rgb(0 0 0 / 0.5);
  --a-hifuel_advisory: #5cc79c; --a-tranzent_foundation: #7fcf94; --a-pathvik: #a99dff; --a-earth_osai: #6ec1dd; --a-iclc: #f29a5e; --a-person: #cdb69c; --a-other: #92a49a;
  --p-instagram: #ff6ea4; --p-linkedin: #5aa7f0; --p-facebook: #6aa5ff; --p-x: #e5ede8; --p-whatsapp_channel: #42d98a;
  --st-draft: #6c7c73; --st-needs_changes: #e0ac35; --st-approved: #4cc287; --st-scheduled: #5d9bff; --st-posted: #5cc79c; --st-rejected: #34453d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { flex: none; }
.icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line);
  padding: calc(18px + env(safe-area-inset-top, 0px)) 14px 18px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
.mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; letter-spacing: -0.02em; }
.brand b { font-family: var(--font-display); font-size: 1.08rem; display: block; line-height: 1.1; }
.brand span { color: var(--muted); font-size: 0.78rem; }
.nav { display: grid; gap: 2px; }
.nav-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; padding: 10px 10px 4px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 9px; color: var(--fg-2); font-weight: 500; text-align: left; }
.nav button:hover { background: var(--surface-2); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .count { margin-left: auto; font-size: 0.72rem; font-weight: 700; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--surface-3); color: var(--fg-2); text-align: center; font-variant-numeric: tabular-nums; }
.nav .count.hot { background: var(--accent); color: var(--accent-fg); }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--surface-2); font-size: 0.85rem; }
.me img { width: 30px; height: 30px; border-radius: 50%; }
.me small { display: block; color: var(--muted); font-size: 0.74rem; }

.shell { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); padding-block: 14px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.topbar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.page-title { margin-right: auto; min-width: 0; }
.page-title h1 { font-family: var(--font-display); font-size: 1.45rem; margin: 0; letter-spacing: -0.015em; line-height: 1.15; text-wrap: balance; }
.page-title p { margin: 2px 0 0; color: var(--muted); font-size: 0.86rem; }
.weekpick { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 3px; box-shadow: var(--shadow); }
.weekpick button { border: 0; background: none; border-radius: 8px; height: 32px; min-width: 32px; padding: 0 8px; color: var(--fg-2); font-weight: 600; font-size: 0.85rem; }
.weekpick button:hover { background: var(--surface-2); }
.weekpick strong { font-variant-numeric: tabular-nums; min-width: 12.5ch; text-align: center; font-size: 0.9rem; font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.filters select, .filters input { height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 0 10px; font-size: 0.86rem; min-width: 0; width: auto; }
.filters input[type="search"] { width: 220px; max-width: 100%; }
.pchips { display: flex; gap: 4px; flex-wrap: wrap; }
.pchip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 6px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 0.82rem; color: var(--fg-2); }
.pchip[aria-pressed="true"] { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 12%, var(--surface)); color: var(--fg); font-weight: 600; }
.clear { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 0.85rem; padding: 0 6px; }

main { padding-block: 24px 80px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; align-content: start; max-width: 1360px; width: 100%; }

.tabbar { display: none; }
.mobilebar { display: none; }

/* ---------- type & atoms ---------- */
h2 { font-family: var(--font-display); font-size: 1.12rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h3 { font-size: 0.95rem; margin: 0; font-weight: 650; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.xs { font-size: 0.78rem; }
.label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 650; }
.mono { font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 0.86rem; padding: 0; text-align: left; }
.linkbtn:hover { text-decoration: underline; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.grid { display: grid; gap: 16px; min-width: 0; align-content: start; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 650; padding: 2px 9px; border-radius: 999px; white-space: nowrap; line-height: 1.5; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.draft { background: var(--surface-3); color: var(--fg-2); }
.pill.needs_changes { background: var(--flag-soft); color: var(--flag); }
.pill.approved { background: var(--ok-soft); color: var(--ok); }
.pill.scheduled { background: var(--info-soft); color: var(--info); }
.pill.posted { background: var(--accent-soft); color: var(--accent); }
.pill.rejected { background: var(--surface-3); color: var(--muted); }
.pill.blocked { background: var(--block-soft); color: var(--block); }
.pill.sample, .pill.campaign { background: var(--info-soft); color: var(--info); }
.pill.campaign::before { display: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 8px 14px; font-weight: 600; font-size: 0.86rem; color: var(--fg); line-height: 1.2; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
.btn.danger { color: var(--block); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn .icon { width: 16px; height: 16px; }

.empty { border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: 30px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty strong { color: var(--fg); font-size: 1rem; }

/* platform badge */
.pf { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; color: var(--pc); background: color-mix(in srgb, var(--pc) 13%, transparent); flex: none; }
.pf svg { width: 14px; height: 14px; }
.pf.lg { width: 30px; height: 30px; border-radius: 8px; }
.pf.lg svg { width: 18px; height: 18px; }

/* ---------- overview ---------- */
.hello { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.hello h2 { font-size: 1.6rem; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; display: grid; gap: 6px; min-width: 0; text-align: left; align-content: start; }
button.kpi:hover { border-color: var(--line-strong); }
.kpi .v { font-family: var(--font-display); font-size: 2rem; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .k { color: var(--muted); font-size: 0.82rem; font-weight: 550; }
.kpi .s { font-size: 0.78rem; color: var(--muted); }
.kpi.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.kpi.accent .k, .kpi.accent .s { color: color-mix(in srgb, var(--accent-fg) 80%, transparent); }
.kpi.alert .v { color: var(--block); }
.stack { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-3); gap: 2px; }
.stack span { display: block; height: 100%; }
.stack.lg { height: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

.spotlight { position: relative; overflow: hidden; }
.spotlight::after { content: ""; position: absolute; inset: 0 0 auto auto; width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--a-pathvik) 20%, transparent), transparent 70%); transform: translate(30%, -40%); pointer-events: none; }
.spot-head { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; position: relative; z-index: 1; }
.spot-head > div:nth-child(2) { flex: 1 1 260px; }
.spot-badge { width: 46px; height: 46px; border-radius: 13px; background: var(--a-pathvik); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; flex: none; }
.progress { display: grid; gap: 6px; }
.progress .bar { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress .bar span { display: block; height: 100%; background: var(--a-pathvik); border-radius: 999px; }
.pcounts { display: flex; flex-wrap: wrap; gap: 8px; }
.pcount { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 10px; background: var(--surface-2); font-size: 0.84rem; }
.pcount b { font-variant-numeric: tabular-nums; }
.ctas { display: flex; flex-wrap: wrap; gap: 6px; }
.ctas span { font-size: 0.78rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg-2); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

.timeline { display: grid; gap: 2px; }
.tl-day { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 650; padding: 10px 10px 4px; }
.tl-row { display: grid; grid-template-columns: 48px 22px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 0; background: none; text-align: left; width: 100%; }
.tl-row:hover { background: var(--surface-2); }
.tl-row .hook { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.88rem; }
.tl-row .who { color: var(--muted); font-size: 0.76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.approver { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.approver:last-child { border-bottom: 0; }
.approver .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font-weight: 700; font-size: 0.85rem; color: var(--fg-2); flex: none; }
.approver .n { margin-left: auto; font-family: var(--font-display); font-size: 1.3rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.activity { display: grid; gap: 12px; }
.activity > div { font-size: 0.85rem; display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.activity p { overflow-wrap: anywhere; }

/* ---------- calendar ---------- */
.viewtoggle { display: inline-flex; background: var(--surface-3); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.viewtoggle button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 0.84rem; font-weight: 600; color: var(--muted); }
.viewtoggle button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.board { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: start; }
.day { display: grid; gap: 8px; min-width: 0; background: var(--surface-2); border-radius: var(--radius); padding: 8px; min-height: 160px; align-content: start; }
.day.today { background: color-mix(in srgb, var(--accent) 9%, var(--surface-2)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 45%, transparent); }
.dayhead { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 4px 4px 2px; min-width: 0; }
.dayhead .dnum { font-family: var(--font-display); font-size: 1.25rem; font-weight: 650; }
.daytag { font-size: 0.66rem; color: var(--info); background: var(--info-soft); border-radius: 6px; padding: 1px 6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.daytag.sensitive { color: var(--block); background: var(--block-soft); }
.chip { text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 9px 10px 9px 12px; display: grid; gap: 5px; position: relative; min-width: 0; box-shadow: var(--shadow); }
.chip::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--acct, var(--a-other)); }
.chip:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.chip .top { display: flex; gap: 6px; align-items: center; font-size: 0.72rem; color: var(--muted); min-width: 0; }
.chip .top .mono { color: var(--fg); font-weight: 500; font-size: 0.76rem; }
.chip .hook { font-size: 0.84rem; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.chip .bottom { display: flex; gap: 6px; align-items: center; justify-content: space-between; font-size: 0.72rem; color: var(--muted); min-width: 0; }
.chip .bottom span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--sc); flex: none; }
.agenda { display: grid; gap: 16px; }
.agenda-day { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; }
.agenda-date { padding-top: 6px; display: grid; align-content: start; justify-items: start; gap: 2px; }
.agenda-date b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; }
.agenda-rows { display: grid; gap: 6px; min-width: 0; }
.arow { display: grid; grid-template-columns: 52px 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; box-shadow: var(--shadow); }
.arow:hover { border-color: var(--line-strong); }
.arow .t { min-width: 0; }

    db.collection("announcements").orderBy("at", "desc").limit(50).onSnapshot(snap => { state.news = snap.docs.map(d => ({ ...d.data(), id: d.id })); render(); resolveNames(state.news.map(n => n.by)); }, () => {});
    db.collection("reports").orderBy("end", "desc").limit(30).onSnapshot(snap => { state.reports = snap.docs.map(d => ({ ...d.data(), id: d.id })); render(); }, () => {});
    db.collection("experiments").orderBy("start", "desc").limit(50).onSnapshot(snap => { state.experiments = snap.docs.map(d => ({ ...d.data(), id: d.id })); render(); }, () => {});
    db.collection("results").onSnapshot(snap => { state.results = new Map(snap.docs.map(d => [d.id, d.data()])); render(); }, () => {});
  }
  start().catch(() => { state.unavailable = true; render(); });
})();
