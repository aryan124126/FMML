<title>Hi Fuel Team Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a compact operations board. Sticky header with week + counts, tabbed views below,
   a side drawer for one post. Emerald from Hi Fuel Advisory's brand is the only accent. */
:root {
  --bg: #f5f7f5;
  --surface: #ffffff;
  --surface-2: #eef2ef;
  --line: #d9e1dc;
  --fg: #142019;
  --muted: #5b6b62;
  --accent: #064e3b;
  --accent-fg: #ffffff;
  --accent-soft: #dcefe6;
  --block: #b42318;
  --block-soft: #fde8e6;
  --flag: #946200;
  --flag-soft: #fdf3d7;
  --ok: #18794e;
  --ok-soft: #ddf3e6;
  --info-soft: #e6ecf7;
  --info: #2c4f8c;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --a-hifuel_advisory: #064e3b; --a-tranzent_foundation: #2f7d4f; --a-pathvik: #6d5ce8;
  --a-earth_osai: #1f6f8b; --a-iclc: #c2571a; --a-person: #6b5b4b; --a-other: #7a8a80;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1512; --surface: #161e1a; --surface-2: #1d2722; --line: #2b3832; --fg: #e4ece7; --muted: #9aaba1;
    --accent: #5cc79c; --accent-fg: #06261c; --accent-soft: #1b3a2e;
    --block: #ff8a80; --block-soft: #3a1c1a; --flag: #f0c45a; --flag-soft: #3a3016; --ok: #6fd6a0; --ok-soft: #173426;
    --info-soft: #1c2840; --info: #9db9ec;
    --a-hifuel_advisory: #5cc79c; --a-tranzent_foundation: #7fcf94; --a-pathvik: #a89cff;
    --a-earth_osai: #6ec1dd; --a-iclc: #f29a5e; --a-person: #c9b29a; --a-other: #9aaba1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #161e1a; --surface-2: #1d2722; --line: #2b3832; --fg: #e4ece7; --muted: #9aaba1;
  --accent: #5cc79c; --accent-fg: #06261c; --accent-soft: #1b3a2e;
  --block: #ff8a80; --block-soft: #3a1c1a; --flag: #f0c45a; --flag-soft: #3a3016; --ok: #6fd6a0; --ok-soft: #173426;
  --info-soft: #1c2840; --info: #9db9ec;
  --a-hifuel_advisory: #5cc79c; --a-tranzent_foundation: #7fcf94; --a-pathvik: #a89cff;
  --a-earth_osai: #6ec1dd; --a-iclc: #f29a5e; --a-person: #c9b29a; --a-other: #9aaba1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-family: var(--font-display); font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 0.85rem; }
.week { display: flex; align-items: center; gap: 6px; }
.week strong { font-variant-numeric: tabular-nums; min-width: 12ch; text-align: center; font-weight: 600; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; }
.iconbtn:hover { background: var(--surface-2); }
.counts { display: flex; flex-wrap: wrap; gap: 6px; }
.count { font-size: 0.8rem; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.count b { font-variant-numeric: tabular-nums; }
.count.block { background: var(--block-soft); color: var(--block); }
.count.review { background: var(--flag-soft); color: var(--flag); }
.count.ok { background: var(--ok-soft); color: var(--ok); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

main { padding-block: 20px 60px; display: grid; gap: 20px; }
h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; text-wrap: balance; }
h3 { font-size: 0.95rem; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.mono { font-family: var(--font-mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; }

.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 8px; }
.notice ul { margin: 0; padding-left: 1.1rem; }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 1rem; margin-bottom: 4px; }

/* Week board */
.board { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.day { display: grid; align-content: start; gap: 8px; min-width: 0; }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 2px; border-bottom: 1px solid var(--line); }
.dayhead b { font-weight: 600; }
.daytag { font-size: 0.7rem; color: var(--info); background: var(--info-soft); border-radius: 6px; padding: 1px 6px; }
.daytag.sensitive { color: var(--block); background: var(--block-soft); }
.chip { text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 9px 8px 11px; cursor: pointer; display: grid; gap: 4px; position: relative; min-width: 0; }
.chip::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 3px; background: var(--acct, var(--a-other)); }
.chip:hover { border-color: var(--muted); }
.chip .top { display: flex; gap: 6px; align-items: center; font-size: 0.75rem; color: var(--muted); }
.chip .hook { font-size: 0.85rem; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pill { font-size: 0.7rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.pill.draft { background: var(--surface-2); color: var(--muted); }
.pill.needs_changes { background: var(--flag-soft); color: var(--flag); }
.pill.approved, .pill.scheduled { background: var(--ok-soft); color: var(--ok); }
.pill.posted { background: var(--accent-soft); color: var(--accent); }
.pill.rejected { background: var(--surface-2); color: var(--muted); text-decoration: line-through; }
.pill.blocked { background: var(--block-soft); color: var(--block); }
.pill.sample { background: var(--info-soft); color: var(--info); }

/* Post cards */
.cards { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.is-blocked { border-color: color-mix(in srgb, var(--block) 45%, var(--line)); }
.cardhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.acct { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.acct i { width: 9px; height: 9px; border-radius: 50%; background: var(--acct, var(--a-other)); display: inline-block; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.82rem; color: var(--muted); }
.cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
.posttext { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-size: 0.92rem; max-width: 70ch; }
.issues { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.issue { font-size: 0.84rem; border-radius: 8px; padding: 7px 10px; display: grid; gap: 2px; }
.issue.block { background: var(--block-soft); color: var(--block); }
.issue.flag { background: var(--flag-soft); color: var(--flag); }
.issue q { color: var(--fg); font-size: 0.8rem; opacity: 0.85; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 600; font-size: 0.88rem; }
.brief { display: grid; gap: 8px; font-size: 0.86rem; margin-top: 8px; }
.brief ol, .brief ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 4px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 0.75rem; }
.swatch i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }
.edit { display: grid; gap: 8px; }
.edit label { display: grid; gap: 3px; font-size: 0.8rem; color: var(--muted); }
textarea, input[type="text"], select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 0.9rem; }
textarea { resize: vertical; min-height: 2.6em; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 500; font-size: 0.88rem; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.danger { color: var(--block); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.hint { font-size: 0.8rem; color: var(--muted); }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--bg); z-index: 21; overflow-y: auto; border-left: 1px solid var(--line);
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 16px; display: grid; align-content: start; gap: 12px; }
.drawer .close { justify-self: end; }

/* Lists */
.list { display: grid; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 4px; }
.item .who { font-size: 0.8rem; color: var(--muted); }
.item p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
form.inline { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }

/* Growth */
.mix { display: grid; gap: 8px; }
.mixrow { display: grid; grid-template-columns: 11rem minmax(0, 1fr) 3rem; gap: 10px; align-items: center; font-size: 0.85rem; }
.track { height: 12px; background: var(--surface-2); border-radius: 6px; overflow: hidden; display: flex; }
.track span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
td.n { font-variant-numeric: tabular-nums; text-align: right; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

.up { color: var(--ok); }
.down { color: var(--block); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.resultbox { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; border-top: 0; }
@media (max-width: 600px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 30; font-size: 0.88rem; max-width: calc(100% - 32px); }

@media (max-width: 900px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .day { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .mixrow { grid-template-columns: 7rem minmax(0, 1fr) 2.5rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide 0.18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: 0.6; } }
}
</style>

<header>
  <div class="wrap">
    <div class="bar">
      <div class="brand"><h1>Hi Fuel Team Hub</h1><span>Plan · review · post</span></div>
      <div class="week" aria-label="Week">
        <button class="iconbtn" id="prevWeek" aria-label="Previous week">‹</button>
        <strong id="weekLabel">This week</strong>
        <button class="iconbtn" id="nextWeek" aria-label="Next week">›</button>
      </div>
      <div class="counts" id="counts"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="week" aria-selected="true">Week</button>
      <button role="tab" data-tab="review" aria-selected="false">Review queue</button>
      <button role="tab" data-tab="kits" aria-selected="false">Advocacy kits</button>
      <button role="tab" data-tab="ideas" aria-selected="false">Ideas</button>
      <button role="tab" data-tab="news" aria-selected="false">Announcements</button>
      <button role="tab" data-tab="growth" aria-selected="false">Growth</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main">
  <div class="empty"><strong>Loading the team's plan…</strong>Posts appear here once Claude loads a week's drafts.</div>
</main>

<div id="drawerRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
  "use strict";
  const PLATFORMS = { instagram: "Instagram", linkedin: "LinkedIn", facebook: "Facebook", whatsapp_channel: "WhatsApp Channel", x: "X" };
  const STATUS_LABEL = { draft: "Draft", needs_changes: "Needs changes", approved: "Approved", scheduled: "Scheduled", posted: "Posted", rejected: "Rejected" };
  const THEMES = { educational: "Educational", impact_story: "Impact story", initiative_promo: "Initiative / promo", behind_the_scenes: "Behind the scenes", founder_team_voice: "Founder / team voice", engagement: "Engagement" };
  const THEME_COLORS = ["var(--a-earth_osai)", "var(--a-tranzent_foundation)", "var(--a-iclc)", "var(--a-other)", "var(--a-pathvik)", "var(--a-person)"];
  const KNOWN_ACCOUNTS = ["hifuel_advisory", "tranzent_foundation", "pathvik", "earth_osai", "iclc"];
  const KEY_DATES = {
    "2026-11-08": ["Diwali", ""], "2026-11-14": ["Children's Day", ""], "2026-11-24": ["Guru Nanak Jayanti", ""],
    "2026-11-26": ["Constitution Day", ""], "2026-12-05": ["World Soil Day", ""], "2026-12-25": ["Christmas", ""],
    "2027-01-26": ["Republic Day", ""], "2027-01-30": ["Martyrs' Day", "sensitive"], "2027-03-21": ["Intl Day of Forests", ""],
    "2027-03-22": ["World Water Day", ""], "2027-03-23": ["Holi", ""], "2027-03-26": ["Good Friday", "sensitive"],
    "2027-04-22": ["Earth Day", ""], "2027-06-05": ["World Environment Day", ""], "2027-06-16": ["Muharram", "sensitive"],
    "2027-07-01": ["Van Mahotsav", ""], "2027-08-15": ["Independence Day", ""], "2027-10-02": ["Gandhi Jayanti", ""], "2027-10-29": ["Diwali", ""]
  };

  const state = {
    posts: new Map(), plans: [], ideas: [], news: [], reports: [], experiments: [], results: new Map(), reportId: null,
    tab: "week", week: null, open: null, loaded: false, unavailable: false,
    me: { id: null, canEdit: false, canWrite: null }, names: {}, pendingRender: false
  };
  let db = null, user = null;
  const $ = (sel, root = document) => root.querySelector(sel);
  const main = $("#main");

  // ---------- helpers ----------
  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "style") n.setAttribute("style", v);
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k === "text") n.textContent = v;
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return n;
  }
  const iso = d => d.toISOString().slice(0, 10);
  function mondayOf(dateStr) { const d = new Date(dateStr + "T00:00:00Z"); const wd = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - wd); return iso(d); }
  function addDays(dateStr, n) { const d = new Date(dateStr + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
  function fmtDay(dateStr, opts) { return new Date(dateStr + "T00:00:00Z").toLocaleDateString("en-IN", { timeZone: "UTC", ...opts }); }
  function todayIST() { return new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10); }
  const acctVar = p => p.account_type === "person" ? "var(--a-person)" : (KNOWN_ACCOUNTS.includes(p.account) ? `var(--a-${p.account})` : "var(--a-other)");
  function publishText(p) { return [p.hook, p.caption, p.cta, (p.hashtags || []).join(" ")].map(s => (s || "").trim()).filter(Boolean).join("\n\n"); }
  const blocks = p => (p.issues || []).filter(i => i.severity === "block");
  const flags = p => (p.issues || []).filter(i => i.severity === "flag");
  const weekPosts = () => [...state.posts.values()].filter(p => p.date >= state.week && p.date <= addDays(state.week, 6)).sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  const nameOf = id => (id && state.names[id]) || (id === state.me.id ? "you" : "a teammate");

  function toast(msg) {
    const root = $("#toastRoot"); root.replaceChildren(el("div", { class: "toast", role: "status", text: msg }));
    clearTimeout(toast.t); toast.t = setTimeout(() => root.replaceChildren(), 3200);
  }
  async function copy(text, btn) {
    try { await navigator.clipboard.writeText(text); toast("Copied"); }
    catch { const ta = el("textarea", { "aria-label": "Text to copy" }); ta.value = text; btn.after(ta); ta.select(); toast("Select-all is ready: press copy on your keyboard"); }
  }
  function errMsg(e) {
    if (e && e.code === "invalid_argument") return "You don't have permission to change this. Ask Aryan for Editor access.";
    if (e && e.code === "quota_exceeded") return "The hub's storage is full. Ask Aryan to archive old weeks.";
    return "That didn't save. Check your connection and try again.";
  }
  async function resolveNames(ids) {
    const need = [...new Set(ids.filter(Boolean))];
    if (!user || !need.length) return;
    const ps = await user.profiles(need);
    let changed = false;
    for (const id of need) { const n = ps[id] && ps[id].name; if (n && state.names[id] !== n) { state.names[id] = n; changed = true; } }
    if (changed) render();
  }

  // ---------- rendering ----------
  function render() {
    if (main.contains(document.activeElement) && document.activeElement.matches("textarea, input, select")) { state.pendingRender = true; return; }
    if (state.drawerFocus) { state.pendingRender = true; return; }
    state.pendingRender = false;
    renderHeader();
    const view = { week: viewWeek, review: viewReview, kits: viewKits, ideas: viewIdeas, news: viewNews, growth: viewGrowth }[state.tab];
    main.replaceChildren(...[].concat(view()));
    renderDrawer();
  }

  function renderHeader() {
    $("#weekLabel").textContent = `${fmtDay(state.week, { day: "numeric", month: "short" })} – ${fmtDay(addDays(state.week, 6), { day: "numeric", month: "short" })}`;
    const ps = weekPosts();
    const count = (cls, n, label) => el("span", { class: `count ${cls}` }, el("b", { text: n }), " ", label);
    const review = ps.filter(p => ["draft", "needs_changes"].includes(p.status) && !blocks(p).length).length;
    $("#counts").replaceChildren(
      count("", ps.length, "posts"),
      count("review", review, "to review"),
      count("block", ps.filter(p => blocks(p).length && !["rejected", "posted"].includes(p.status)).length, "blocked"),
      count("ok", ps.filter(p => ["approved", "scheduled", "posted"].includes(p.status)).length, "approved")
    );
    for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-selected", String(b.dataset.tab === state.tab));
  }

    return el("section", { class: "notice", style: "gap:14px" },
      el("div", { class: "row", style: "align-items:center" }, el("h3", { text: r.kind === "monthly" ? "Monthly growth report" : "Weekly performance report" }), sel),
      (r.priorities || []).length ? el("div", {}, el("div", { class: "label", text: "Next month's three priorities" }), el("ol", { style: "margin:4px 0 0;padding-left:1.2rem;display:grid;gap:4px" }, r.priorities.map(t => el("li", { text: t })))) : null,
      el("div", { class: "cols" }, bullets("What worked", r.worked, "Not enough data for a clear conclusion yet."), bullets("What didn't", r.didnt, "Nothing clearly underperformed.")),
      table,
      enq.length ? el("p", { class: "small", style: "margin:0" }, el("b", { text: "Inbound enquiries from social: " }), enq.map(([a, n]) => `${labelForAccount(a)} ${n}`).join(" · ")) : null,
      (r.top_posts || []).length ? el("div", {}, el("div", { class: "label", text: "Top posts" }), el("ul", { style: "margin:4px 0 0;padding-left:1.1rem;display:grid;gap:4px" },
        r.top_posts.map(t => el("li", {}, el("b", { text: `${pct(t.engagement_rate)} ` }), `${t.account_name} · ${PL[t.platform] || t.platform} · ${t.format}: ${t.text}`)))) : null,
      bullets("Data notes", r.notes, "None."),
      el("p", { class: "hint", style: "margin:0", text: "Engagement = likes + comments + shares + saves. Comparisons need at least 3 posts on each side." }));
  }
  function experimentSection() {
    const head = el("h3", { text: "Experiments" });
    if (!state.experiments.length) return el("section", { style: "display:grid;gap:8px" }, head, emptyState("No experiments running", "Ask Claude to start one: change one thing (format, time, theme) for 2-4 weeks and compare."));
    const verdict = { better: ["ok", "Better"], worse: ["blocked", "Worse"], no_difference: ["draft", "No clear difference"], pending: ["needs_changes", "Collecting data"] };
    return el("section", { style: "display:grid;gap:8px" }, head, el("div", { class: "list" }, state.experiments.map(e => {
      const v = verdict[e.verdict] || (e.status === "running" ? verdict.pending : ["draft", e.status]);
      return el("div", { class: "item" },
        el("div", { class: "cardhead" }, el("b", { text: e.name }), el("span", { class: `pill ${v[0]}`, text: e.status === "running" ? "Running" : v[1] }),
          el("span", { class: "small muted", text: `${labelForAccount(e.account)} · ${({ format: "Format", hour_band: "Time of day", theme: "Theme", pillar: "Pillar", slot_source: "Time source" })[e.variable] || e.variable}: ${String(e.value).replace(/_/g, " ")} · ${fmtDay(e.start, { day: "numeric", month: "short" })} – ${fmtDay(e.end, { day: "numeric", month: "short" })}` })),
        el("p", { class: "small", text: `Hypothesis: ${e.hypothesis}` }),
        e.result ? el("p", { class: "small", text: e.result }) : null);
    })));
  }

  // Advocacy: people log their own LinkedIn results (personal analytics aren't available by API).
  function resultForm(p) {
    const r = state.results.get(p.id) || {};
    if (state.me.canWrite === false) return null;
    const f = (id, label, type = "number", value = "") => { const i = el("input", { type, id: `${p.id}-r-${id}`, min: type === "number" ? "0" : null }); i.value = value ?? ""; return [i, el("label", { for: i.id }, label, i)]; };
    const [when, whenL] = f("when", "Posted at (IST)", "datetime-local", r.posted_at || `${p.date}T${p.time || "10:00"}`);
    const [imp, impL] = f("imp", "Impressions", "number", r.impressions);
    const [rea, reaL] = f("rea", "Reactions", "number", r.reactions);
    const [com, comL] = f("com", "Comments", "number", r.comments);
    const [rep, repL] = f("rep", "Reposts", "number", r.reposts);
    const [lnk, lnkL] = f("lnk", "Link to your post", "text", r.link);
    const num = i => i.value === "" ? null : Math.max(0, Number(i.value));
    return el("details", { class: "resultbox" }, el("summary", { text: r.at ? `Results logged (${(r.impressions ?? 0).toLocaleString("en-IN")} impressions). Update` : "Posted it? Log your results" }),
      el("form", { class: "edit", style: "margin-top:8px", onsubmit: async e => {
        e.preventDefault();
        try {
          await db.doc(`results/${p.id}`).set({ post_id: p.id, posted_at: when.value, impressions: num(imp), reactions: num(rea), comments: num(com), reposts: num(rep), link: lnk.value.trim(), by: state.me.id, at: new Date().toISOString() });
          toast("Results saved. Thanks!");
        } catch (err) { toast(errMsg(err)); }
      } }, el("div", { class: "grid2" }, whenL, impL, reaL, comL, repL, lnkL),
        el("p", { class: "hint", style: "margin:0", text: "Check the numbers about 3 days after posting, from the post's analytics on LinkedIn." }),
        el("div", { class: "actions" }, el("button", { class: "btn primary", type: "submit", text: "Save results" }))));
  }

  // ---------- drawer ----------
  function openPost(id) { state.open = id; renderDrawer(); }
  function closeDrawer() { state.open = null; state.drawerFocus = false; renderDrawer(); if (state.pendingRender) render(); }
  function renderDrawer() {
    const root = $("#drawerRoot");
    const p = state.open && state.posts.get(state.open);
    if (!p) { root.replaceChildren(); return; }
    if (root.contains(document.activeElement) && document.activeElement.matches("textarea, input, select")) return;
    const drawer = el("aside", { class: "drawer", role: "dialog", "aria-modal": "true", "aria-label": "Post details" },
      el("button", { class: "btn close", onclick: closeDrawer, text: "Close" }), postCard(p, { editable: true }));
    drawer.addEventListener("focusin", e => { if (e.target.matches("textarea, input, select")) state.drawerFocus = true; });
    drawer.addEventListener("focusout", () => { state.drawerFocus = false; });
    root.replaceChildren(el("div", { class: "scrim", onclick: closeDrawer }), drawer);
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && state.open) closeDrawer(); });
  // Wait a moment after an input loses focus, so a click on a button next to it lands before the redraw.
  document.addEventListener("focusout", () => setTimeout(() => { if (state.pendingRender && !state.drawerFocus) render(); }, 300));

  // ---------- navigation ----------
  $("#tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    state.tab = b.dataset.tab; try { history.replaceState(null, "", "#" + state.tab); } catch {}
    render();
  });
  $("#prevWeek").addEventListener("click", () => { state.week = addDays(state.week, -7); render(); });
  $("#nextWeek").addEventListener("click", () => { state.week = addDays(state.week, 7); render(); });
  const hash = (location.hash || "").slice(1);
  if (["week", "review", "kits", "ideas", "news", "growth"].includes(hash)) state.tab = hash;
  state.week = mondayOf(todayIST());
  render();

  // ---------- data ----------
  function pickWeek() {
    // Open on the current week if it has posts, otherwise the next week that does.
    const dates = [...state.posts.values()].map(p => p.date).sort();
    const cur = mondayOf(todayIST());
    if (!dates.length || dates.some(d => d >= cur && d <= addDays(cur, 6))) return cur;
    const next = dates.find(d => d >= cur);
    return mondayOf(next || dates[dates.length - 1]);
  }

  async function start() {
    const claude = window.claude;
    if (!claude || !claude.use) { state.unavailable = true; render(); return; }
    [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db) { state.unavailable = true; render(); return; }
    if (user) {
      const me = await user.me();
      state.me.id = me.id; state.me.canEdit = !!me.canEdit;
      state.me.canWrite = await user.can("data.write");
      if (me.id && me.name) state.names[me.id] = me.name;
    }
    let firstPosts = true;
    db.collection("posts").onSnapshot(snap => {
      state.posts = new Map(snap.docs.map(d => [d.id, { ...d.data(), id: d.id }]));
      state.loaded = true;
      if (firstPosts) { firstPosts = false; state.week = pickWeek(); }
      render();
      resolveNames([...state.posts.values()].map(p => p.review && p.review.by));
    }, () => { state.unavailable = true; render(); });
    db.collection("plans").onSnapshot(snap => { state.plans = snap.docs.map(d => d.data()); render(); }, () => {});
    db.collection("ideas").orderBy("at", "desc").limit(200).onSnapshot(snap => {
      state.ideas = snap.docs.map(d => ({ ...d.data(), id: d.id })); render(); resolveNames(state.ideas.map(i => i.by));
    }, () => {});
    db.collection("announcements").orderBy("at", "desc").limit(50).onSnapshot(snap => {
      state.news = snap.docs.map(d => ({ ...d.data(), id: d.id })); render(); resolveNames(state.news.map(n => n.by));
    }, () => {});
    db.collection("reports").orderBy("end", "desc").limit(30).onSnapshot(snap => { state.reports = snap.docs.map(d => ({ ...d.data(), id: d.id })); render(); }, () => {});
    db.collection("experiments").orderBy("start", "desc").limit(50).onSnapshot(snap => { state.experiments = snap.docs.map(d => ({ ...d.data(), id: d.id })); render(); }, () => {});
    db.collection("results").onSnapshot(snap => { state.results = new Map(snap.docs.map(d => [d.id, d.data()])); render(); }, () => {});
  }
  start().catch(() => { state.unavailable = true; render(); });
})();
</script>
